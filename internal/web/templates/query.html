{{define "query"}}
<div class="query-layout">
    <div class="card editor-panel">
        <h2>SQL Editor</h2>
        <textarea id="sql-editor" rows="8" style="width:100%;padding:0.75rem;background:var(--surface-2);border:0.0625rem solid var(--border);border-radius:var(--radius);color:var(--text);font-family:'SF Mono','Fira Code',monospace;font-size:0.85rem;resize:vertical;margin-bottom:0.75rem;" placeholder="SELECT * FROM read_parquet('s3://bucket/prefix/*.parquet') LIMIT 10"></textarea>
        <div style="display:flex;gap:0.5rem;">
            <button class="btn" onclick="runQuery()">▶ Run</button>
            <button class="btn btn-secondary" onclick="clearResults()">Clear</button>
        </div>
        <p style="color:var(--text-muted);font-size:0.75rem;margin-top:0.375rem;">Ctrl+Enter to run</p>
    </div>
    <div class="card results-panel">
        <h2>Results</h2>
        <div id="query-status"></div>
        <div id="query-results">
            <p style="color:var(--text-muted);font-size:0.875rem;">Run a query to see results</p>
        </div>
    </div>
</div>

<script>
    function runQuery() {
        const sql = document.getElementById('sql-editor').value;
        if (!sql) return;

        const status = document.getElementById('query-status');
        const results = document.getElementById('query-results');
        status.innerHTML = '<p style="color:var(--text-muted);">Running...</p>';
        results.innerHTML = '';

        fetch('/query', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({sql: sql})
        })
        .then(r => r.json())
        .then(data => {
            if (data.error) {
                status.innerHTML = '<div class="error-message">Error: ' + data.error + '</div>';
                return;
            }
            status.innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">' + data.row_count + ' rows in ' + data.elapsed_ms + 'ms</p>';

            if (data.row_count === 0) {
                results.innerHTML = '<p style="color:var(--text-muted);">No rows returned</p>';
                return;
            }

            let html = '<table><thead><tr>';
            data.columns.forEach(col => {
                html += '<th>' + col.name + '<br><span style="font-weight:400;color:var(--text-muted);font-size:0.75rem;">' + col.type + '</span></th>';
            });
            html += '</tr></thead><tbody>';
            data.rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => {
                    if (cell === null) {
                        html += '<td style="color:var(--text-muted);font-style:italic;">NULL</td>';
                    } else {
                        html += '<td>' + escapeHtml(String(cell)) + '</td>';
                    }
                });
                html += '</tr>';
            });
            html += '</tbody></table>';
            results.innerHTML = html;
        })
        .catch(err => {
            status.innerHTML = '<div class="error-message">Request failed: ' + err.message + '</div>';
        });
    }

    function clearResults() {
        document.getElementById('query-status').innerHTML = '';
        document.getElementById('query-results').innerHTML = '<p style="color:var(--text-muted);font-size:0.875rem;">Run a query to see results</p>';
    }

    function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 'Enter') {
            runQuery();
        }
    });
</script>
{{end}}
