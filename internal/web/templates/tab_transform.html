{{define "tab_transform"}}
<div id="transform-app">
  <div class="flex-row">
    <div class="card" style="flex:1.2;">
      <h3 class="mb-sm">Browse Files</h3>
      <div class="flex-row" style="flex-wrap:wrap;">
        <select id="tf-project-select" class="input" style="flex:1;min-width:140px;" onchange="tfSwitchProject(this.value)">
          <option value="">Project...</option>
          {{range .Projects}}
          <option value="{{.ProjectID}}">{{.ProjectName}}</option>
          {{end}}
        </select>
        <select id="tf-bucket" class="input" style="flex:2;min-width:180px;" onchange="tfLoadBucket(this.value)">
          <option value="">Select bucket...</option>
        </select>
      </div>
      <div id="tf-file-list" style="max-height:400px;overflow-y:auto;font-size:0.85rem;margin-top:0.5rem;">
        <p style="color:var(--text-muted);">Select a project and bucket to browse files for conversion.</p>
      </div>
    </div>
    <div class="card" style="flex:1;">
      <h3 class="mb-sm">Convert Files</h3>
      <div class="steps" id="tf-steps">
        <span class="step active"><span class="step-num">1</span> Browse &amp; Select</span>
        <span class="step"><span class="step-num">2</span> Configure</span>
        <span class="step"><span class="step-num">3</span> Schedule</span>
        <span class="step"><span class="step-num">4</span> Post-Action</span>
      </div>

      <div id="transform-file-list">
        <p style="color:var(--text-muted);font-size:0.85rem;">Click files in the browser to add them here.</p>
      </div>
      <div id="transform-config-area" style="display:none;margin-top:0.75rem;"></div>

      <div id="tf-schedule-area" style="margin-top:0.75rem;display:none;">
        <h4 style="font-size:0.9rem;margin-bottom:0.5rem;">Schedule</h4>
        <div class="mode-toggle">
          <input type="radio" name="tf-schedule-mode" value="once" id="tf-sched-once" checked onchange="tfToggleSchedule()"><label for="tf-sched-once">Run once</label>
          <input type="radio" name="tf-schedule-mode" value="schedule" id="tf-sched-recur" onchange="tfToggleSchedule()"><label for="tf-sched-recur">Repeating</label>
        </div>
        <div id="tf-cron-area" style="display:none;">
          <label style="font-size:0.85rem;color:var(--text-muted);">Cron preset:</label>
          <select id="tf-cron-preset" class="input" style="width:auto;min-width:150px;font-size:0.8rem;" onchange="tfCronPresetChange()">
            <option value="">Custom...</option>
            <option value="* * * * *">Every minute</option>
            <option value="0 * * * *">Every hour</option>
            <option value="0 0 * * *">Daily (midnight)</option>
            <option value="0 0 * * 0">Weekly (Sunday)</option>
            <option value="0 0 1 * *">Monthly (1st)</option>
          </select>
          <label style="font-size:0.85rem;color:var(--text-muted);margin-left:0.5rem;">Custom cron:</label>
          <input type="text" id="tf-cron-custom" class="input" style="width:140px;font-size:0.8rem;font-family:monospace;" placeholder="* * * * *" onchange="tfClearCronPreset()">
          <span id="tf-cron-preview" style="font-size:0.8rem;color:var(--text-muted);margin-left:0.5rem;"></span>
        </div>
      </div>

      <div id="tf-postaction-area" style="margin-top:0.75rem;display:none;">
        <h4 style="font-size:0.9rem;margin-bottom:0.5rem;">After Conversion</h4>
        <div class="mode-toggle" style="flex-wrap:wrap;">
          <input type="radio" name="tf-post-action" value="" id="tf-post-keep" checked onchange="tfTogglePostAction()"><label for="tf-post-keep">Keep originals</label>
          <input type="radio" name="tf-post-action" value="delete" id="tf-post-del" onchange="tfTogglePostAction()"><label for="tf-post-del">Delete originals</label>
          <input type="radio" name="tf-post-action" value="move" id="tf-post-move" onchange="tfTogglePostAction()"><label for="tf-post-move">Move to bucket</label>
        </div>
        <div id="tf-move-area" style="display:none;margin-top:0.5rem;" class="flex-row">
          <select id="tf-move-bucket" class="input" style="flex:1;">
            <option value="">Select target bucket...</option>
          </select>
          <input type="text" id="tf-move-prefix" class="input" style="flex:1;font-family:monospace;" placeholder="prefix/">
        </div>
      </div>

      <div id="tf-convert-progress" style="display:none;margin-top:0.75rem;"></div>

      <div style="margin-top:0.75rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
        <button class="btn" onclick="tfStartConvert()">⬇ Convert to Parquet</button>
        <button class="btn btn-secondary" style="display:none;" onclick="tfStartSchedule()" id="tf-schedule-btn">Schedule</button>
        <label style="font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;gap:0.25rem;"><input type="checkbox" id="tf-delete-original"> Delete originals</label>
      </div>
      <div style="margin-top:0.5rem;">
        <a href="#" onclick="navigateToTab('schedules');return false;" class="btn-link">View Schedules</a>
      </div>
    </div>
  </div>
</div>

<script src="/static/column_config.js"></script>
<script src="/static/transform.js"></script>
<script src="/static/schedules.js"></script>
{{end}}
