{{define "browse"}}
<div style="display:flex;gap:1.5rem;align-items:flex-start;">
    <div class="card" style="flex:0 0 250px;">
        <h2>Buckets</h2>
        <div id="bucket-list"
             hx-get="/buckets"
             hx-trigger="load"
             hx-swap="innerHTML">
            <p style="color:var(--text-muted);font-size:0.875rem;">Loading...</p>
        </div>
    </div>
    <div class="card" style="flex:1;">
        <h2 id="current-path">Select a bucket or prefix</h2>
        <div id="file-list">
            <p style="color:var(--text-muted);font-size:0.875rem;">Choose a bucket from the sidebar</p>
        </div>
    </div>
</div>

<script>
    window.loadPrefix = function(bucket, prefix) {
        const el = document.getElementById('file-list');
        el.setAttribute('hx-get', '/buckets/' + encodeURIComponent(bucket) + '?prefix=' + encodeURIComponent(prefix));
        el.setAttribute('hx-trigger', 'load');
        el.innerHTML = '<p style="color:var(--text-muted);">Loading...</p>';
        htmx.process(el);
        htmx.trigger(el, 'load');
        document.getElementById('current-path').textContent = bucket + '/' + prefix;
    };
</script>
{{end}}
