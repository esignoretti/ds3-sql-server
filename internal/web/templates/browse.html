{{define "browse"}}
<div class="single-page">
  <div class="top-bar">
    <div class="form-group" style="margin-bottom:0;">
      <label for="project-select">Project</label>
      <select id="project-select" class="input" onchange="switchProject(this.value)">
        <option value="">Select project...</option>
        {{range .Projects}}
        <option value="{{.ProjectID}}">{{.ProjectName}}</option>
        {{end}}
      </select>
    </div>
  </div>

  <div class="main-area">
    <div class="browser-panel">
      <div class="panel-header">
        <span id="breadcrumb">Select a project to browse buckets</span>
      </div>
      <div id="browser-content" class="panel-body">
        <p style="color:var(--text-muted);font-size:0.875rem;">Select a project first</p>
      </div>
    </div>

    <div class="query-panel">
      <div class="panel-header">
        <span>Query</span>
        <span id="selected-files-badge" style="font-size:0.8rem;color:var(--text-muted);"></span>
      </div>
      <div class="panel-body">
        <textarea id="sql-editor" rows="5" style="width:100%;padding:0.5rem;background:var(--surface-2);border:0.0625rem solid var(--border);border-radius:var(--radius);color:var(--text);font-family:monospace;font-size:0.85rem;resize:vertical;margin-bottom:0.5rem;" placeholder="SELECT * FROM read_parquet('s3://bucket/*.parquet') LIMIT 100"></textarea>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="buildSQL()">🔨 Build SQL</button>
          <button class="btn" onclick="runQuery()">▶ Run</button>
          <button class="btn btn-secondary" onclick="clearQuery()">Clear</button>
        </div>
        <div id="query-status" style="font-size:0.85rem;"></div>
        <div id="export-bar" style="display:none;gap:0.5rem;margin-bottom:0.5rem;align-items:center;">
          <button class="btn btn-secondary" style="font-size:0.8rem;padding:0.25rem 0.75rem;" onclick="exportCSV()">⬇ CSV</button>
          <button class="btn btn-secondary" style="font-size:0.8rem;padding:0.25rem 0.75rem;" onclick="exportJSON()">⬇ JSON</button>
        </div>
        <div id="page-controls" style="display:none;gap:0.5rem;margin-bottom:0.5rem;align-items:center;flex-wrap:wrap;">
          <label style="font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;gap:0.25rem;">
            Rows per page:
            <input type="number" id="page-size-input" value="100" min="1" max="100000" onchange="renderPage()" style="width:80px;background:var(--surface-2);color:var(--text);border:0.0625rem solid var(--border);border-radius:var(--radius);padding:0.2rem 0.4rem;font-size:0.8rem;">
          </label>
          <span id="page-info" style="font-size:0.85rem;color:var(--text-muted);"></span>
          <button id="prev-page-btn" class="btn btn-secondary" style="font-size:0.8rem;padding:0.2rem 0.6rem;" onclick="prevPage()">← Prev</button>
          <button id="next-page-btn" class="btn btn-secondary" style="font-size:0.8rem;padding:0.2rem 0.6rem;" onclick="nextPage()">Next →</button>
          <button class="btn btn-secondary" style="font-size:0.8rem;padding:0.25rem 0.75rem;" onclick="analyzeResults()">📊 Analyze</button>
        </div>
        <div id="query-results" style="overflow-x:auto;"></div>
        <!-- Column Analytics Panel -->
        <div id="analytics-backdrop" class="analytics-backdrop" onclick="closeAnalyticsPanel()"></div>
        <div id="analytics-panel" class="analytics-panel">
          <div id="analytics-panel-content">
            <p style="color:var(--text-muted);font-size:0.85rem;">Click a column header to see analytics</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
.single-page { display:flex; flex-direction:column; gap:0.75rem; }
.top-bar { background:var(--surface); border:0.0625rem solid var(--border); border-radius:var(--radius); padding:0.75rem 1rem; }
.top-bar .form-group { display:flex; align-items:center; gap:0.75rem; }
.top-bar label { margin-bottom:0; white-space:nowrap; }
.top-bar select { width:300px; }
.main-area { display:flex; gap:0.75rem; }
.browser-panel { flex:2; background:var(--surface); border:0.0625rem solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; min-height:300px; }
.query-panel { flex:3; background:var(--surface); border:0.0625rem solid var(--border); border-radius:var(--radius); display:flex; flex-direction:column; }
.panel-header { padding:0.5rem 0.75rem; border-bottom:0.0625rem solid var(--border); font-weight:600; font-size:0.9rem; display:flex; justify-content:space-between; }
.panel-body { padding:0.75rem; overflow-y:auto; flex:1; }
.bucket-item { padding:0.25rem 0.5rem; cursor:pointer; border-radius:var(--radius); font-size:0.85rem; }
.bucket-item:hover { background:var(--surface-2); }
</style>

<script>
var selPaths = [];
var selBucket = '';
var selProject = '';
var lastResult = null;
var currentPage = 0;

function switchProject(id) {
  if (!id) return;
  selProject = id;
  selBucket = '';
  selPaths = [];
  showBuckets();
}

function showBuckets() {
  if (!selProject) return;
  selBucket = '';
  selPaths = [];
  document.getElementById('breadcrumb').textContent = 'Loading buckets...';
  document.getElementById('browser-content').innerHTML = '<p style="color:var(--text-muted);">Loading...</p>';
  fetch('/buckets?project=' + encodeURIComponent(selProject))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) { document.getElementById('browser-content').innerHTML = '<p style="color:var(--red);">' + d.error + '</p>'; return; }
      if (!d.buckets || !d.buckets.length) { document.getElementById('browser-content').innerHTML = '<p style="color:var(--text-muted);">No buckets</p>'; return; }
      document.getElementById('breadcrumb').innerHTML = '<a href="#" onclick="showBuckets();return false" style="color:var(--primary);text-decoration:none;">Buckets</a>';
      var html = '';
      d.buckets.forEach(function(b) { html += '<div class="bucket-item" onclick="loadPrefix(\'' + escJs(b.name) + '\',\'\')">📁 ' + escHtml(b.name) + '</div>'; });
      html += '<div style="margin-top:0.75rem;border-top:0.0625rem solid var(--border);padding-top:0.75rem;">';
      html += '<div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.25rem;">Or enter a bucket name:</div>';
      html += '<div style="display:flex;gap:0.5rem;"><input type="text" id="manual-bucket" class="input" placeholder="my-bucket" style="flex:1;">';
      html += '<button class="btn btn-secondary" onclick="manualBucket()">Open</button></div></div>';
      document.getElementById('browser-content').innerHTML = html;
    })
    .catch(function(e) { document.getElementById('browser-content').innerHTML = '<p style="color:var(--red);">Error: ' + e.message + '</p>'; });
}

function loadPrefix(bucket, prefix) {
  selBucket = bucket;
  var crumb = document.getElementById('breadcrumb');
  crumb.innerHTML = '<a href="#" onclick="showBuckets();return false" style="color:var(--primary);text-decoration:none;">Buckets</a> / ' + escHtml(bucket) + (prefix ? '/' + escHtml(prefix) : '');
  document.getElementById('browser-content').innerHTML = '<p style="color:var(--text-muted);">Loading...</p>';
  fetch('/buckets/' + encodeURIComponent(bucket) + '?project=' + encodeURIComponent(selProject) + '&prefix=' + encodeURIComponent(prefix))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (d.error) { document.getElementById('browser-content').innerHTML = '<p style="color:var(--red);">' + d.error + '</p>'; return; }
      var html = '';
      d.prefixes.forEach(function(p) {
        var name = p.replace(/\/$/,'').split('/').pop();
        html += '<div class="bucket-item" onclick="loadPrefix(\'' + escJs(bucket) + '\',\'' + escJs(p) + '\')">📁 ' + escHtml(name) + '</div>';
      });
      var convertible = d.objects.filter(function(o) { var l = o.key.toLowerCase(); return l.endsWith('.log') || l.endsWith('.txt') || l.endsWith('.syslog') || l.endsWith('.out') || l.endsWith('.err'); });
      var supported = d.objects.filter(function(o) { var l = o.key.toLowerCase(); return l.endsWith('.parquet') || l.endsWith('.csv') || l.endsWith('.json') || l.endsWith('.jsonl') || l.endsWith('.tsv'); });
      var otherFiles = d.objects.filter(function(o) {
        var l = o.key.toLowerCase();
        return !convertible.some(function(c) { return c.key === o.key; }) && !supported.some(function(s) { return s.key === o.key; });
      });
      if (supported.length) {
        html += '<div style="margin-top:0.5rem;font-size:0.85rem;color:var(--text-muted);">Queryable files — click to add:</div>';
        supported.forEach(function(o) {
          var s3path = 's3://' + bucket + '/' + o.key;
          html += '<div class="bucket-item" onclick="togglePath(\'' + escAttr(s3path) + '\',this)">☐ ' + escHtml(o.key.split('/').pop()) + ' <span style="color:var(--text-muted);font-size:0.75rem;">' + fmtSize(o.size) + '</span></div>';
        });
      }
      if (convertible.length) {
        html += '<div style="margin-top:0.5rem;font-size:0.85rem;color:#f87171;font-weight:600;">Convertible files — select to convert:</div>';
        html += '<div id="convertible-list">';
        convertible.forEach(function(o) {
          html += '<label class="convert-item" style="display:flex;align-items:center;gap:0.375rem;padding:0.25rem 0.5rem;font-size:0.85rem;color:#f87171;cursor:pointer;">';
          html += '<input type="checkbox" class="convert-checkbox" data-file="' + escAttr(o.key) + '" onchange="updateConvertBtn()">';
          html += '⚠️ ' + escHtml(o.key.split('/').pop()) + ' <span style="color:var(--text-muted);font-size:0.75rem;">' + fmtSize(o.size) + '</span>';
          html += ' <a href="/column-config?project=' + encodeURIComponent(selProject) + '&bucket=' + encodeURIComponent(bucket) + '&file=' + encodeURIComponent(o.key) + '" style="color:var(--primary);font-size:0.75rem;text-decoration:none;cursor:pointer;">[configure]</a>';
          html += '</label>';
        });
        html += '</div>';
        html += '<div id="convert-controls" style="margin-top:0.5rem;display:none;gap:0.5rem;align-items:center;flex-wrap:wrap;">';
        html += '<button class="btn" style="font-size:0.8rem;padding:0.25rem 0.75rem;" onclick="startConvert()">⬇ Convert to Parquet</button>';
        html += '<label style="font-size:0.8rem;color:var(--text-muted);display:flex;align-items:center;gap:0.25rem;"><input type="checkbox" id="delete-original"> Delete original after conversion</label>';
        html += '</div>';
      }
      if (otherFiles.length) {
        html += '<details style="margin-top:0.5rem;"><summary style="cursor:pointer;color:var(--text-muted);font-size:0.85rem;">Other (' + otherFiles.length + ')</summary>';
        otherFiles.forEach(function(o) { html += '<div style="opacity:0.5;font-size:0.8rem;">' + escHtml(o.key.split('/').pop()) + '</div>'; });
        html += '</details>';
      }
      if (!supported.length && !convertible.length && !otherFiles.length && !d.prefixes.length) { html = '<p style="color:var(--text-muted);">No files</p>'; }
      document.getElementById('browser-content').innerHTML = html;
    })
    .catch(function(e) { document.getElementById('browser-content').innerHTML = '<p style="color:var(--red);">Error: ' + e.message + '</p>'; });
}

function manualBucket() {
  var bucket = document.getElementById('manual-bucket').value.trim();
  if (!bucket) { alert('Enter a bucket name'); return; }
  loadPrefix(bucket, '');
}

function togglePath(path, el) {
  var idx = selPaths.indexOf(path);
  if (idx >= 0) { selPaths.splice(idx, 1); el.innerHTML = '☐ ' + el.textContent.trim().substring(2); }
  else { selPaths.push(path); el.innerHTML = '☑ ' + el.textContent.trim().substring(2); }
  updateBadge();
}

function updateBadge() {
  var b = document.getElementById('selected-files-badge');
  b.textContent = selPaths.length ? selPaths.length + ' file(s) selected' : '';
}

function buildSQL() {
  if (!selPaths.length) { alert('Click files in the browser to select them'); return; }
  var prefix = selPaths[0].substring(0, selPaths[0].lastIndexOf('/') + 1);
  var same = selPaths.every(function(p) { return p.startsWith(prefix); });
  var sql;
  if (same && selPaths.length > 1) {
    var ext = selPaths[0].split('.').pop();
    var allSame = selPaths.every(function(p) { return p.endsWith('.' + ext); });
    sql = "SELECT * FROM " + reader(selPaths[0]) + "('" + prefix + "*." + (allSame ? ext : '*') + "') LIMIT 100";
  } else {
    sql = selPaths.map(function(p) { return "SELECT * FROM " + reader(p) + "('" + p + "')"; }).join('\nUNION ALL\n') + '\nLIMIT 100';
  }
  document.getElementById('sql-editor').value = sql;
}

function reader(p) {
  var l = p.toLowerCase();
  if (l.endsWith('.csv') || l.endsWith('.tsv')) return 'read_csv_auto';
  if (l.endsWith('.json') || l.endsWith('.jsonl')) return 'read_json_auto';
  return 'read_parquet';
}

function runQuery() {
  var sql = document.getElementById('sql-editor').value;
  if (!sql) { alert('Write a query or click Build SQL'); return; }
  if (!selProject) { alert('Select a project'); return; }
  var status = document.getElementById('query-status');
  var results = document.getElementById('query-results');
  status.innerHTML = 'Running...';
  results.innerHTML = '';
  document.getElementById('page-controls').style.display = 'none';
  document.getElementById('export-bar').style.display = 'none';
  fetch('/query?project=' + encodeURIComponent(selProject), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sql: sql})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) { status.innerHTML = '<span class="error">' + d.error + '</span>'; return; }
    lastResult = d;
    panelState.analysisCache = null;
    panelState.fetchingAnalysis = false;
    currentPage = 0;
    status.innerHTML = d.row_count + ' rows in ' + d.elapsed_ms + 'ms';
    document.getElementById('export-bar').style.display = d.row_count ? 'flex' : 'none';
    if (!d.row_count) { results.innerHTML = '<p style="color:var(--text-muted);">No rows</p>'; return; }
    renderPage();
  })
  .catch(function(e) { status.innerHTML = '<span class="error">Error: ' + e.message + '</span>'; });
}

function renderPage() {
  var results = document.getElementById('query-results');
  var d = lastResult;
  if (!d) return;
  var input = document.getElementById('page-size-input');
  var pageSize = parseInt(input.value);
  if (!pageSize || pageSize < 1) pageSize = d.rows.length;
  var totalPages = Math.ceil(d.rows.length / pageSize);
  if (totalPages < 1) totalPages = 1;
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  var start = currentPage * pageSize;
  var end = Math.min(start + pageSize, d.rows.length);

  var h = '<table><thead><tr>';
  d.columns.forEach(function(c, ci) {
    h += '<th onclick="openAnalyticsPanel(\'' + escJs(c.name) + '\',' + ci + ', event)" style="cursor:pointer;user-select:none;" title="Click for column analytics">' + escHtml(c.name) + '<br><span style="font-weight:400;color:var(--text-muted);font-size:0.75rem;">' + escHtml(c.type) + '</span></th>';
  });
  h += '</tr></thead><tbody>';
  for (var i = start; i < end; i++) {
    h += '<tr>';
    d.rows[i].forEach(function(v) { h += '<td>' + (v === null ? '<span style="color:var(--text-muted);font-style:italic;">NULL</span>' : escHtml(String(v))) + '</td>'; });
    h += '</tr>';
  }
  h += '</tbody></table>';
  results.innerHTML = h;

  var ctrl = document.getElementById('page-controls');
  var info = document.getElementById('page-info');
  var prevBtn = document.getElementById('prev-page-btn');
  var nextBtn = document.getElementById('next-page-btn');
  info.textContent = 'Page ' + (currentPage + 1) + '/' + totalPages + ' (' + d.row_count + ' rows)';
  prevBtn.disabled = totalPages <= 1 || currentPage === 0;
  nextBtn.disabled = totalPages <= 1 || currentPage >= totalPages - 1;
  ctrl.style.display = 'flex';
}

function prevPage() {
  if (currentPage > 0) { currentPage--; renderPage(); }
}

function nextPage() {
  var ps = parseInt(document.getElementById('page-size-input').value);
  if (!ps || ps < 1) ps = lastResult.rows.length;
  var totalPages = Math.ceil(lastResult.rows.length / ps);
  if (currentPage < totalPages - 1) { currentPage++; renderPage(); }
}

function clearQuery() {
  document.getElementById('sql-editor').value = '';
  document.getElementById('query-status').innerHTML = '';
  document.getElementById('query-results').innerHTML = '';
  document.getElementById('export-bar').style.display = 'none';
  document.getElementById('page-controls').style.display = 'none';
  lastResult = null;
}

function analyzeResults() {
  if (!lastResult) { alert('Run a query first'); return; }
  var status = document.getElementById('query-status');
  status.innerHTML = 'Saving analysis...';
  // First get analysis
  fetch('/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      columns: lastResult.columns,
      rows: lastResult.rows
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(analysis) {
    if (analysis.error) { status.innerHTML = '<span class="error">' + analysis.error + '</span>'; return; }
    // Save as a report immediately (bypasses sessionStorage limits)
    return fetch('/api/reports', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        title: 'Analysis - ' + new Date().toLocaleString(),
        sql: document.getElementById('sql-editor').value,
        project_id: selProject,
        query_columns: lastResult.columns,
        query_rows: lastResult.rows,
        analysis: analysis,
        charts: []
      })
    });
  })
  .then(function(r) { return r.json(); })
  .then(function(report) {
    window.location.href = '/report?id=' + encodeURIComponent(report.id);
  })
  .catch(function(e) { status.innerHTML = '<span class="error">Error: ' + e.message + '</span>'; });
}

function updateConvertBtn() {
  var checked = document.querySelectorAll('.convert-checkbox:checked');
  var ctrl = document.getElementById('convert-controls');
  if (ctrl) ctrl.style.display = checked.length ? 'flex' : 'none';
}

function startConvert() {
  var checked = document.querySelectorAll('.convert-checkbox:checked');
  if (!checked.length) return;
  var files = Array.from(checked).map(function(cb) { return cb.getAttribute('data-file'); });
  var deleteOrig = document.getElementById('delete-original').checked;

  var html = '<div class="convert-progress" id="convert-progress">';
  html += '<div class="card"><h3>Converting to Parquet</h3>';
  html += '<div id="convert-status"><p style="color:var(--text-muted);">Starting conversion...</p></div>';
  html += '</div></div>';
  document.getElementById('browser-content').innerHTML += html;

  fetch('/convert?project=' + encodeURIComponent(selProject), {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({bucket: selBucket, files: files, delete_original: deleteOrig})
  })
  .then(function(r) { return r.json(); })
  .then(function(job) { pollConvertStatus(job.job_id); })
  .catch(function(e) { document.getElementById('convert-status').innerHTML = '<span class="error">Error: ' + e.message + '</span>'; });
}

function pollConvertStatus(jobId) {
  fetch('/convert/status/' + encodeURIComponent(jobId))
    .then(function(r) { return r.json(); })
    .then(function(job) {
      var html = '<div style="margin-bottom:0.75rem;">';
      var pct = job.total > 0 ? Math.round(job.completed / job.total * 100) : 0;
      html += '<div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem;">';
      html += '<div style="flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;">';
      html += '<div style="height:100%;width:' + pct + '%;background:var(--primary);border-radius:4px;transition:width 0.5s;"></div></div>';
      html += '<span style="font-size:0.85rem;color:var(--text-muted);">' + job.completed + '/' + job.total + '</span>';
      html += '</div>';
      html += '<table style="font-size:0.8rem;"><thead><tr><th>File</th><th>Status</th><th>Time</th></tr></thead><tbody>';
      job.results.forEach(function(r) {
        var icon = r.status === 'done' ? '✅' : r.status === 'error' ? '❌' : r.status === 'running' ? '⏳' : '⬜';
        html += '<tr><td>' + escHtml(r.file) + '</td><td>' + icon + ' ' + r.status + (r.error ? ': ' + escHtml(r.error) : '') + '</td><td>' + (r.elapsed_ms ? r.elapsed_ms + 'ms' : '-') + '</td></tr>';
      });
      html += '</tbody></table>';
      html += '</div>';
      if (job.status === 'running') {
        html += '<p style="font-size:0.8rem;color:var(--text-muted);">Running...</p>';
      } else {
        html += '<button class="btn btn-secondary" style="font-size:0.8rem;padding:0.25rem 0.75rem;" onclick="location.reload()">Done — Refresh file list</button>';
      }
      document.getElementById('convert-status').innerHTML = html;
      if (job.status === 'running') {
        setTimeout(function() { pollConvertStatus(jobId); }, 2000);
      }
    })
    .catch(function(e) { document.getElementById('convert-status').innerHTML = '<span class="error">Poll error: ' + e.message + '</span>'; });
}

function exportCSV() {
  if (!lastResult) return;
  var cols = lastResult.columns.map(function(c) { return c.name; });
  var lines = [cols.map(escCsv).join(',')];
  lastResult.rows.forEach(function(r) {
    lines.push(r.map(function(v) { return escCsv(v === null ? '' : String(v)); }).join(','));
  });
  download(lines.join('\n'), 'query-result.csv', 'text/csv');
}

function exportJSON() {
  if (!lastResult) return;
  var arr = lastResult.rows.map(function(r) {
    var o = {};
    lastResult.columns.forEach(function(c, i) { o[c.name] = r[i]; });
    return o;
  });
  download(JSON.stringify(arr, null, 2), 'query-result.json', 'application/json');
}

function download(content, filename, mime) {
  var blob = new Blob([content], {type: mime});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function escCsv(s) {
  if (s.indexOf(',') >= 0 || s.indexOf('"') >= 0 || s.indexOf('\n') >= 0) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function fmtSize(b) {
  if (!b) return '0B';
  var u = ['B','KB','MB','GB','TB'], i = Math.floor(Math.log(b) / Math.log(1024));
  return (b / Math.pow(1024, i)).toFixed(1) + ' ' + u[i];
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJs(s) { return s.replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function escAttr(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function openAnalyticsPanel(colName, colIdx, evt) {
  if (!lastResult || !lastResult.columns) return;
  var isMulti = evt && evt.ctrlKey;

  if (!isMulti) {
    panelState.selectedCols = [{name: colName, idx: colIdx}];
    panelState.activeMultiCols = {};
  } else {
    if (!Object.keys(panelState.activeMultiCols).length) {
      for (var i = 0; i < panelState.selectedCols.length; i++) {
        panelState.activeMultiCols[panelState.selectedCols[i].name] = true;
      }
    }
    var existing = panelState.selectedCols.findIndex(function(c) { return c.name === colName; });
    if (existing >= 0) {
      panelState.selectedCols.splice(existing, 1);
      if (!panelState.selectedCols.length) { closeAnalyticsPanel(); return; }
    } else {
      panelState.selectedCols.push({name: colName, idx: colIdx});
      panelState.activeMultiCols[colName] = true;
    }
  }

  renderAnalyticsPanel();
  document.getElementById('analytics-backdrop').classList.add('visible');
  document.getElementById('analytics-panel').classList.add('open');

  // Fetch server analysis if not cached
  if (!panelState.analysisCache) {
    fetchAnalysis();
  }
}

function closeAnalyticsPanel() {
  document.getElementById('analytics-backdrop').classList.remove('visible');
  document.getElementById('analytics-panel').classList.remove('open');
  panelState.selectedCols = [];
}

function computeQuickStats(colIdx) {
  var rows = lastResult.rows;
  var total = rows.length;
  var nullCount = 0;
  var distinct = new Set();
  var sum = 0;
  var numericCount = 0;
  var min = Infinity;
  var max = -Infinity;
  var topFreq = {};

  for (var i = 0; i < rows.length; i++) {
    var v = rows[i][colIdx];
    if (v === null || v === undefined) {
      nullCount++;
      continue;
    }
    var sv = String(v);
    distinct.add(sv);
    topFreq[sv] = (topFreq[sv] || 0) + 1;

    if (typeof v === 'number') {
      sum += v;
      numericCount++;
      if (v < min) min = v;
      if (v > max) max = v;
    } else if (!isNaN(parseFloat(v))) {
      var n = parseFloat(v);
      sum += n;
      numericCount++;
      if (n < min) min = n;
      if (n > max) max = n;
    }
  }

  // Top 3 values
  var topEntries = Object.entries(topFreq).sort(function(a,b) { return b[1] - a[1]; }).slice(0, 3);
  var topVals = topEntries.map(function(e) { return e[0] + ' (' + e[1] + ')'; });

  return {
    total: total,
    nullCount: nullCount,
    nullPct: total > 0 ? (nullCount / total * 100).toFixed(1) : '0.0',
    distinct: distinct.size,
    isNumeric: numericCount > 0,
    min: numericCount > 0 ? min : null,
    max: numericCount > 0 ? max : null,
    mean: numericCount > 0 ? (sum / numericCount).toFixed(2) : null,
    topValues: topVals
  };
}

function selectRepresentativeRows(colIdx, maxRows) {
  maxRows = maxRows || 8;
  var rows = lastResult.rows;
  var selected = [];
  var used = new Set();
  var nullCount = 0;

  // 1. Null rows (up to 3)
  for (var i = 0; i < rows.length && nullCount < 3; i++) {
    if (rows[i][colIdx] === null || rows[i][colIdx] === undefined) {
      if (!used.has(i)) { used.add(i); selected.push(i); nullCount++; }
    }
  }

  // 2. Outliers for numeric columns (z-score > 2)
  var vals = [];
  for (var i = 0; i < rows.length; i++) {
    var v = rows[i][colIdx];
    if (v !== null && v !== undefined && !isNaN(parseFloat(v))) {
      vals.push({idx: i, val: parseFloat(v)});
    }
  }
  if (vals.length > 3) {
    var sum = vals.reduce(function(s, x) { return s + x.val; }, 0);
    var mean = sum / vals.length;
    var sqDiff = vals.reduce(function(s, x) { return s + (x.val - mean) * (x.val - mean); }, 0);
    var stddev = Math.sqrt(sqDiff / vals.length);
    if (stddev > 0) {
      var outlierCount = 0;
      for (var vi = 0; vi < vals.length && outlierCount < 3 && selected.length < maxRows; vi++) {
        var z = Math.abs((vals[vi].val - mean) / stddev);
        if (z > 2 && !used.has(vals[vi].idx)) {
          used.add(vals[vi].idx);
          selected.push(vals[vi].idx);
          outlierCount++;
        }
      }
    }
  }

  // 3. Random fill
  var remaining = [];
  for (var i = 0; i < rows.length; i++) {
    if (!used.has(i)) remaining.push(i);
  }
  // Shuffle
  for (var i = remaining.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = remaining[i]; remaining[i] = remaining[j]; remaining[j] = tmp;
  }
  for (var i = 0; i < remaining.length && selected.length < maxRows; i++) {
    selected.push(remaining[i]);
  }

  return selected.sort(function(a,b) { return a - b; });
}

function renderAnalyticsPanel() {
  var content = document.getElementById('analytics-panel-content');
  if (!content || !panelState.selectedCols.length) return;

  var isMulti = panelState.selectedCols.length > 1;

  var html = '';

  if (isMulti) {
    html += renderMultiColumnPanel();
  } else {
    html += renderSingleColumnPanel();
  }

  content.innerHTML = html;
  renderPanelCharts();
}

function renderMultiColumnPanel() {
  var html = '';

  // Header
  html += '<div class="apanel-header">';
  var names = panelState.selectedCols.map(function(c) { return c.name; });
  html += '<h3>' + names.length + ' columns selected</h3>';
  html += '<button class="apanel-close" onclick="closeAnalyticsPanel()">\u00D7</button>';
  html += '</div>';

  // Column tag selector
  html += '<div class="apanel-col-list">';
  for (var i = 0; i < panelState.selectedCols.length; i++) {
    var c = panelState.selectedCols[i];
    var isActive = panelState.activeMultiCols[c.name] !== false;
    html += '<span class="apanel-col-tag' + (isActive ? ' active' : '') + '" onclick="toggleMultiCol(' + i + ')">' + escHtml(c.name) + ' <span class="remove-col" onclick="event.stopPropagation(); removeMultiCol(' + i + ')">\u00D7</span></span>';
  }
  html += '</div>';

  // Overlaid distributions chart
  html += '<div id="apanel-chart" class="apanel-chart-wrap multi">';
  if (panelState.analysisCache) {
    var hasData = false;
    for (var i = 0; i < panelState.selectedCols.length; i++) {
      if (panelState.analysisCache.columns[panelState.selectedCols[i].name]) hasData = true;
    }
    if (hasData) {
      html += '<div class="chart-canvas-wrapper"><canvas id="apanel-canvas-multi"></canvas></div>';
    } else {
      html += '<div class="apanel-loading">Loading overlaid distributions...</div>';
    }
  } else {
    html += '<div class="apanel-loading">Loading overlaid distributions...</div>';
  }
  html += '</div>';

  // Correlation matrix
  var numCols = panelState.selectedCols.filter(function(c) {
    var t = getColType(c.name).toUpperCase();
    return /INT|FLOAT|DOUBLE|DECIMAL|NUMERIC/.test(t);
  });
  if (numCols.length >= 2 && panelState.analysisCache && panelState.analysisCache.correlations) {
    html += '<div class="apanel-corr">';
    html += '<h4>Correlation Matrix (Pearson)</h4>';
    html += buildCorrelationMatrix(numCols);
    html += '</div>';
  }

  return html;
}

function toggleMultiCol(idx) {
  var c = panelState.selectedCols[idx];
  if (!c) return;
  var current = panelState.activeMultiCols[c.name];
  panelState.activeMultiCols[c.name] = current === false ? true : false;
  renderAnalyticsPanel();
}

function removeMultiCol(idx) {
  var removed = panelState.selectedCols[idx];
  if (removed) delete panelState.activeMultiCols[removed.name];
  panelState.selectedCols.splice(idx, 1);
  if (panelState.selectedCols.length <= 1) {
    if (panelState.selectedCols.length === 1) {
      renderAnalyticsPanel();
    } else {
      closeAnalyticsPanel();
    }
    return;
  }
  renderAnalyticsPanel();
}

function buildCorrelationMatrix(cols) {
  var names = cols.map(function(c) { return c.name; });
  var n = names.length;
  var html = '<div class="corr-grid" style="grid-template-columns:auto repeat(' + n + ', 1fr);gap:2px;">';

  // Header row
  html += '<div class="corr-cell header"></div>';
  for (var j = 0; j < n; j++) {
    html += '<div class="corr-cell header" style="font-size:0.7rem;">' + escHtml(names[j]) + '</div>';
  }

  // Data rows
  for (var i = 0; i < n; i++) {
    html += '<div class="corr-cell header" style="font-size:0.7rem;">' + escHtml(names[i]) + '</div>';
    for (var j = 0; j < n; j++) {
      if (i === j) {
        html += '<div class="corr-cell diag">1.00</div>';
      } else {
        var corr = findCorrelation(names[i], names[j]);
        if (corr !== null) {
          var cls = corr > 0.1 ? 'pos' : (corr < -0.1 ? 'neg' : 'neutral');
          var intensity = Math.min(Math.abs(corr) * 0.8 + 0.1, 0.9);
          var bg = '';
          if (corr > 0.1) {
            bg = 'background:rgba(0,101,255,' + intensity + ');';
          } else if (corr < -0.1) {
            bg = 'background:rgba(248,113,113,' + intensity + ');';
          }
          html += '<div class="corr-cell ' + cls + '" style="' + bg + '">' + corr.toFixed(2) + '</div>';
        } else {
          html += '<div class="corr-cell na">\u2014</div>';
        }
      }
    }
  }

  html += '</div>';
  return html;
}

function findCorrelation(colA, colB) {
  if (!panelState.analysisCache || !panelState.analysisCache.correlations) return null;
  for (var i = 0; i < panelState.analysisCache.correlations.length; i++) {
    var c = panelState.analysisCache.correlations[i];
    if ((c.col_a === colA && c.col_b === colB) || (c.col_a === colB && c.col_b === colA)) {
      return c.value;
    }
  }
  return null;
}

function renderSingleColumnPanel() {
  var col = panelState.selectedCols[0];
  var colDef = lastResult.columns[col.idx];
  var stats = computeQuickStats(col.idx);
  var reprRows = selectRepresentativeRows(col.idx);
  var analysis = panelState.analysisCache ? panelState.analysisCache.columns[col.name] : null;

  var html = '';

  // Header
  html += '<div class="apanel-header">';
  html += '<h3>' + escHtml(col.name) + ' <span class="type-badge">' + escHtml(colDef.type) + '</span></h3>';
  html += '<button class="apanel-close" onclick="closeAnalyticsPanel()">\u00D7</button>';
  html += '</div>';

  // Quick stats
  html += '<div class="apanel-stats">';
  html += '<span class="apanel-stat"><span class="apanel-stat-label">Rows:</span> <span class="apanel-stat-value">' + stats.total + '</span></span>';
  html += '<span class="apanel-stat"><span class="apanel-stat-label">Null:</span> <span class="apanel-stat-value null">' + stats.nullCount + ' (' + stats.nullPct + '%)</span></span>';
  html += '<span class="apanel-stat"><span class="apanel-stat-label">Distinct:</span> <span class="apanel-stat-value distinct">' + stats.distinct + '</span></span>';
  if (stats.isNumeric) {
    html += '<span class="apanel-stat"><span class="apanel-stat-label">Min:</span> <span class="apanel-stat-value">' + (stats.min !== null ? stats.min.toFixed(2) : '—') + '</span></span>';
    html += '<span class="apanel-stat"><span class="apanel-stat-label">Max:</span> <span class="apanel-stat-value">' + (stats.max !== null ? stats.max.toFixed(2) : '—') + '</span></span>';
    html += '<span class="apanel-stat"><span class="apanel-stat-label">Mean:</span> <span class="apanel-stat-value">' + (stats.mean || '—') + '</span></span>';
  }
  if (stats.topValues.length) {
    html += '<span class="apanel-stat"><span class="apanel-stat-label">Top:</span> <span class="apanel-stat-value" style="font-weight:400;font-size:0.75rem;">' + escHtml(stats.topValues.join(', ')) + '</span></span>';
  }
  html += '</div>';

  // Chart area
  html += '<div id="apanel-chart" class="apanel-chart-wrap">';
  if (analysis) {
    html += '<div class="chart-canvas-wrapper"><canvas id="apanel-canvas"></canvas></div>';
  } else {
    html += '<div class="apanel-loading">Loading histogram...</div>';
  }
  html += '</div>';

  // Summary line
  if (analysis && panelState.analysisCache) {
    var summary = findColumnSummary(col.name);
    if (summary) {
      html += '<div class="apanel-summary">' + escHtml(summary) + '</div>';
    }
  }

  // Representative rows
  html += '<div class="apanel-repr">';
  html += '<h4>Representative Rows</h4>';

  // Determine neighbor columns
  var leftIdx = col.idx > 0 ? col.idx - 1 : (col.idx + 1 < lastResult.columns.length ? col.idx + 1 : -1);
  var rightIdx = col.idx + 1 < lastResult.columns.length ? col.idx + 1 : (col.idx > 0 ? col.idx - 1 : -1);
  // Ensure left/right are different and not same as col
  if (leftIdx === col.idx) leftIdx = -1;
  if (rightIdx === col.idx) rightIdx = -1;
  if (leftIdx === rightIdx) rightIdx = -1;

  html += '<table><thead><tr><th>#</th>';
  if (leftIdx >= 0) html += '<th>' + escHtml(lastResult.columns[leftIdx].name) + '</th>';
  html += '<th>' + escHtml(col.name) + '</th>';
  if (rightIdx >= 0) html += '<th>' + escHtml(lastResult.columns[rightIdx].name) + '</th>';
  html += '</tr></thead><tbody>';

  for (var ri = 0; ri < reprRows.length; ri++) {
    var rowIdx = reprRows[ri];
    html += '<tr>';
    html += '<td><span class="row-idx" onclick="scrollToRow(' + rowIdx + ')">' + (rowIdx + 1) + '</span></td>';
    if (leftIdx >= 0) html += '<td>' + formatCell(lastResult.rows[rowIdx][leftIdx]) + '</td>';
    html += '<td>' + formatCell(lastResult.rows[rowIdx][col.idx]) + '</td>';
    if (rightIdx >= 0) html += '<td>' + formatCell(lastResult.rows[rowIdx][rightIdx]) + '</td>';
    html += '</tr>';
  }
  html += '</tbody></table>';
  html += '</div>';

  return html;
}

function formatCell(val) {
  if (val === null || val === undefined) return '<span class="null-val">NULL</span>';
  return escHtml(String(val));
}

function scrollToRow(rowIdx) {
  var table = document.querySelector('#query-results table');
  if (!table) return;
  var rows = table.querySelectorAll('tbody tr');
  if (rows[rowIdx]) {
    rows[rowIdx].scrollIntoView({block: 'center', behavior: 'smooth'});
    rows[rowIdx].style.background = 'var(--primary)';
    rows[rowIdx].style.color = '#fff';
    setTimeout(function() {
      rows[rowIdx].style.background = '';
      rows[rowIdx].style.color = '';
    }, 2000);
  }
}

function findColumnSummary(colName) {
  if (!panelState.analysisCache || !panelState.analysisCache.summary) return null;
  for (var i = 0; i < panelState.analysisCache.summary.length; i++) {
    if (panelState.analysisCache.summary[i].startsWith(colName + ' ')) {
      return panelState.analysisCache.summary[i];
    }
    if (panelState.analysisCache.summary[i].startsWith(colName + ':')) {
      return panelState.analysisCache.summary[i];
    }
  }
  return null;
}

function renderPanelCharts() {
  if (!panelState.analysisCache) return;

  if (panelState.selectedCols.length === 1) {
    renderSingleColumnChart();
  } else {
    renderMultiColumnCharts();
  }
}

function getColType(colName) {
  for (var i = 0; i < lastResult.columns.length; i++) {
    if (lastResult.columns[i].name === colName) return lastResult.columns[i].type;
  }
  return 'VARCHAR';
}

function renderSingleColumnChart() {
  var canvas = document.getElementById('apanel-canvas');
  if (!canvas) return;

  var col = panelState.selectedCols[0];
  var analysis = panelState.analysisCache.columns[col.name];
  if (!analysis) {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  var ctx = canvas.getContext('2d');
  if (canvas._chart) { canvas._chart.destroy(); }

  var chartConfig = buildSingleChartConfig(analysis, col);
  if (chartConfig) {
    canvas._chart = new Chart(ctx, chartConfig);
  }
}

function buildSingleChartConfig(analysis, col) {
  var colType = getColType(col.name);
  var isNumeric = /INT|FLOAT|DOUBLE|DECIMAL|NUMERIC/.test(colType.toUpperCase());
  var isTemporal = /TIMESTAMP|DATE|TIME/.test(colType.toUpperCase());
  var isBoolean = /BOOL/.test(colType.toUpperCase());

  if (isBoolean || analysis.type === 'boolean') {
    return buildBooleanChart(analysis, col);
  }
  if (isNumeric || analysis.type === 'numeric') {
    if (analysis.histogram && analysis.histogram.length) {
      return buildHistogramChart(analysis, col);
    }
    return buildNumericStatsChart(analysis, col);
  }
  if (isTemporal || analysis.type === 'temporal') {
    return buildTemporalChart(analysis, col);
  }
  // Default: categorical
  if (analysis.top_values && analysis.top_values.length) {
    return buildTopValuesChart(analysis, col);
  }
  return null;
}

function buildHistogramChart(analysis, col) {
  var bins = analysis.histogram;
  var labels = bins.map(function(b) {
    var s = b.bin_start.toFixed(1);
    var e = b.bin_end.toFixed(1);
    return s + '-' + e;
  });
  var data = bins.map(function(b) { return b.count; });

  return {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Count',
        data: data,
        backgroundColor: 'rgba(0,101,255,0.6)',
        borderColor: 'rgba(0,101,255,1)',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterLabel: function(ctx) {
              var bin = bins[ctx.dataIndex];
              return 'Range: ' + bin.bin_start.toFixed(2) + ' - ' + bin.bin_end.toFixed(2);
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#9099A1', font: { size: 9 }, maxRotation: 45 },
          grid: { color: '#31393F' }
        },
        y: {
          ticks: { color: '#9099A1', font: { size: 9 } },
          grid: { color: '#31393F' },
          beginAtZero: true
        }
      }
    }
  };
}

function buildTopValuesChart(analysis, col) {
  var topVals = analysis.top_values;
  if (!topVals || !topVals.length) return null;

  // Limit to top 10
  topVals = topVals.slice(0, 10);

  var labels = topVals.map(function(v) { return v.value; });
  var data = topVals.map(function(v) { return v.count; });
  var pcts = topVals.map(function(v) { return v.pct.toFixed(1); });

  return {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Frequency',
        data: data,
        backgroundColor: PANEL_COLORS.slice(0, labels.length),
        borderWidth: 0
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              return ctx.parsed.x + ' (' + pcts[ctx.dataIndex] + '%)';
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#9099A1', font: { size: 9 } },
          grid: { color: '#31393F' },
          beginAtZero: true
        },
        y: {
          ticks: { color: '#9099A1', font: { size: 9 } },
          grid: { display: false }
        }
      }
    }
  };
}

function buildBooleanChart(analysis, col) {
  var stats = analysis.stats || {};
  var trueCount = stats.true_count || 0;
  var falseCount = (stats.count || 0) - trueCount - (stats.null_count || 0);
  var nullCount = stats.null_count || 0;
  var total = stats.count || 1;

  return {
    type: 'bar',
    data: {
      labels: ['Boolean'],
      datasets: [
        {
          label: 'True (' + (stats.true_pct || 0).toFixed(1) + '%)',
          data: [trueCount],
          backgroundColor: '#27B681'
        },
        {
          label: 'False (' + (falseCount / total * 100).toFixed(1) + '%)',
          data: [falseCount],
          backgroundColor: '#f87171'
        },
        {
          label: 'Null (' + (nullCount / total * 100).toFixed(1) + '%)',
          data: [nullCount],
          backgroundColor: '#596773'
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#DEE4EA', font: { size: 9 } } } },
      scales: {
        x: { stacked: true, ticks: { color: '#9099A1' }, grid: { color: '#31393F' }, beginAtZero: true },
        y: { stacked: true, ticks: { color: '#9099A1' }, grid: { display: false } }
      }
    }
  };
}

function buildNumericStatsChart(analysis, col) {
  var stats = analysis.stats || {};
  var mean = stats.mean || 0;
  var stddev = stats.stddev || 0;
  var min = stats.min || 0;
  var max = stats.max || 0;

  return {
    type: 'bar',
    data: {
      labels: ['Min', 'Mean\u00B1\u03C3', 'Max'],
      datasets: [{
        label: 'Value',
        data: [min, mean, max],
        backgroundColor: ['#8739B1', '#0065FF', '#27B681']
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterLabel: function(ctx) {
              if (ctx.dataIndex === 1) return '\u03C3 = ' + stddev.toFixed(2);
              return '';
            }
          }
        }
      },
      scales: {
        x: { ticks: { color: '#9099A1', font: { size: 9 } }, grid: { display: false } },
        y: { ticks: { color: '#9099A1', font: { size: 9 } }, grid: { color: '#31393F' } }
      }
    }
  };
}

function buildTemporalChart(analysis, col) {
  if (analysis.histogram && analysis.histogram.length) {
    return buildHistogramChart(analysis, col);
  }
  return null;
}

function renderMultiColumnCharts() {
  var canvas = document.getElementById('apanel-canvas-multi');
  if (!canvas || !panelState.analysisCache) return;

  var ctx = canvas.getContext('2d');
  if (canvas._chart) { canvas._chart.destroy(); }

  var activeCols = panelState.selectedCols.filter(function(c) {
    return panelState.activeMultiCols[c.name] !== false;
  });
  if (!activeCols.length) return;
  var datasets = [];
  var allLabels = [];

  // Determine if all selected cols are numeric (for histograms) or mixed
  var allNumeric = activeCols.every(function(c) {
    var t = getColType(c.name).toUpperCase();
    return /INT|FLOAT|DOUBLE|DECIMAL|NUMERIC/.test(t);
  });

  if (allNumeric) {
    // Overlaid normalized histograms using bin centers for common x-axis
    var allBins = [];
    for (var i = 0; i < activeCols.length; i++) {
      var analysis = panelState.analysisCache.columns[activeCols[i].name];
      if (!analysis || !analysis.histogram || !analysis.histogram.length) continue;
      var bins = analysis.histogram;
      var total = bins.reduce(function(s, b) { return s + b.count; }, 0);
      var points = bins.map(function(b) {
        return {
          x: (b.bin_start + b.bin_end) / 2,
          y: total > 0 ? b.count / total : 0
        };
      });
      allBins.push({name: activeCols[i].name, points: points});
    }

    if (!allBins.length) return;

    datasets = allBins.map(function(b, i) {
      return {
        label: b.name,
        data: b.points,
        backgroundColor: PANEL_COLORS[i % PANEL_COLORS.length] + '66',
        borderColor: PANEL_COLORS[i % PANEL_COLORS.length],
        borderWidth: 1,
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        showLine: true
      };
    });

    canvas._chart = new Chart(ctx, {
      type: 'scatter',
      data: { datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#DEE4EA', font: { size: 9 } } },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                return ctx.dataset.label + ': ' + (ctx.parsed.y * 100).toFixed(1) + '% at ' + ctx.parsed.x.toFixed(2);
              }
            }
          }
        },
        scales: {
          x: {
            type: 'linear',
            ticks: { color: '#9099A1', font: { size: 8 } },
            grid: { color: '#31393F' },
            title: { display: true, text: 'Value', color: '#9099A1', font: { size: 9 } }
          },
          y: {
            ticks: { color: '#9099A1', font: { size: 8 }, callback: function(v) { return (v * 100).toFixed(0) + '%'; } },
            grid: { color: '#31393F' },
            beginAtZero: true,
            title: { display: true, text: 'Density', color: '#9099A1', font: { size: 9 } }
          }
        },
        elements: { point: { radius: 0 } }
      }
    });
  } else {
    // Mixed or categorical: grouped bar chart
    var categories = {};
    for (var i = 0; i < activeCols.length; i++) {
      var analysis = panelState.analysisCache.columns[activeCols[i].name];
      if (!analysis || !analysis.top_values) continue;
      var topVals = analysis.top_values.slice(0, 5);
      topVals.forEach(function(v) {
        if (!categories[v.value]) categories[v.value] = {};
        categories[v.value][activeCols[i].name] = v.count;
      });
    }

    allLabels = Object.keys(categories).slice(0, 10);
    datasets = activeCols.map(function(c, i) {
      return {
        label: c.name,
        data: allLabels.map(function(l) { return categories[l] && categories[l][c.name] ? categories[l][c.name] : 0; }),
        backgroundColor: PANEL_COLORS[i % PANEL_COLORS.length]
      };
    });

    canvas._chart = new Chart(ctx, {
      type: 'bar',
      data: { labels: allLabels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#DEE4EA', font: { size: 9 } } } },
        scales: {
          x: { ticks: { color: '#9099A1', font: { size: 8 } }, grid: { color: '#31393F' } },
          y: { ticks: { color: '#9099A1', font: { size: 8 } }, grid: { color: '#31393F' }, beginAtZero: true }
        }
      }
    });
  }
}

function fetchAnalysis() {
  if (!lastResult || panelState.fetchingAnalysis) return;
  panelState.fetchingAnalysis = true;
  var chartWrap = document.getElementById('apanel-chart');
  if (chartWrap) chartWrap.innerHTML = '<div class="apanel-loading">Loading histogram...</div>';

  fetch('/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      columns: lastResult.columns,
      rows: lastResult.rows
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    panelState.fetchingAnalysis = false;
    if (d.error) {
      if (chartWrap) chartWrap.innerHTML = '<div class="apanel-loading" style="color:var(--red);">Analysis error: ' + escHtml(d.error) + '</div>';
      return;
    }
    panelState.analysisCache = d;
    renderAnalyticsPanel();
  })
  .catch(function(e) {
    panelState.fetchingAnalysis = false;
    if (chartWrap) chartWrap.innerHTML = '<div class="apanel-loading" style="color:var(--red);">Error: ' + e.message + '</div>';
  });
}

// --- Analytics Panel State ---
var panelState = {
  selectedCols: [],
  analysisCache: null,  // cached /analyze response
  fetchingAnalysis: false,
  activeMultiCols: {}   // set of active column names for multi-mode
};
var PANEL_COLORS = ['#0065FF','#27B681','#F3B356','#8739B1','#f87171','#06b6d4','#a78bfa','#fb923c','#34d399','#f472b6'];

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeAnalyticsPanel();
  }
  if (e.ctrlKey && e.key === 'Enter') { runQuery(); }
});
</script>
